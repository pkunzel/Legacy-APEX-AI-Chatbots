<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Chatbot project system architecture</title>
  <desc id="desc">Current Phase 1 runtime boundaries linking the conversation and agent facades to memory, provider adapters, external services, and persistence tables.</desc>
  <defs>
